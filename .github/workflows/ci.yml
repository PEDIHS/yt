name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q config.py db.py models.py security.py downloader.py youtube.py jobs.py main.py panel.py
      - name: Import core modules
        env:
          SECRET_KEY: ci-secret
          PANEL_PASSWORD: ci-password
          TELEGRAM_BOT_TOKEN: 123456:ci
          TELEGRAM_ADMIN_IDS: 1
        run: python -c "import config, db, models, security, downloader, youtube, jobs"
