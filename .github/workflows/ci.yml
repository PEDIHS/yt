name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q config.py db.py models.py security.py downloader.py youtube.py analytics.py integrations.py jobs.py main.py panel.py tests

      - name: Import core modules
        env:
          SECRET_KEY: ci-secret
          PANEL_PASSWORD: ci-password
          TELEGRAM_BOT_TOKEN: 123456:ci
          TELEGRAM_ADMIN_IDS: 1
        run: python -c "import config, db, models, security, downloader, youtube, analytics, integrations, jobs"

      - name: Run analytics unit tests
        env:
          SECRET_KEY: ci-secret
        run: python -m unittest discover -s tests -v

      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader("templates"))
          for path in sorted(Path("templates").glob("*.html")):
              env.get_template(path.name)
              print("parsed", path)
          PY

      - name: Check dashboard JavaScript syntax
        run: node --check static/panel.js
